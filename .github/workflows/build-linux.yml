name: Build Linux
on: [workflow_dispatch, push]
jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux & BoringSSL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev cmake golang perl clang ninja-build
      - name: Ensure BoringSSL vendor exists
        run: |
          if [ ! -d "vendor/boringssl" ]; then
            ls -la scripts/ || true
            for s in scripts/*.sh; do [ -f "$s" ] && bash "$s" || true; done
          fi
          if [ ! -d "vendor/boringssl" ]; then
            mkdir -p vendor
            git clone --depth 1 https://boringssl.googlesource.com/boringssl vendor/boringssl
          fi
      - name: Install frontend & build Tauri
        run: |
          npm install
          npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: anilili-linux
          path: src-tauri/target/release/bundle/appimage/*.AppImage
